template: true

project:
  name: "demo-project"
  description: ""

mcu:
  part: "STM32F407VGT6"

toolchain:
  compiler: "arm-none-eabi-gcc"
  # host_compiler: "gcc"   # only needed once tests/*_test.c exist

paths:
  registers: "./hardware/registers/"
  bsp: "./bsp/"
  schematic: "./hardware/schematic/"
  coding_standard: "./standards/coding_standard.md"
  process_spec: "./standards/process_spec.yaml"

context:
  max_tokens: null
  reserve_tokens: 8192
  constitution_file: "./standards/constitution.md"

llm:
  provider: "openai_compatible"
  model: "Qwen3.8-27B"
  max_tokens: 8192
  context_length: 262144
  temperature: 0.0

