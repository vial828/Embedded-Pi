[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firmware-agent"
version = "0.1.0"
description = "Autonomous embedded firmware development agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["openai>=1.40"]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
epi = "firmware_agent.main:main"
embedded-pi = "firmware_agent.main:main"
fa = "firmware_agent.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
